name: Experiment CI - npm test

on:
  push:
    branches:
      - edidada/main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      # Same steps as the upstream node.js.yml.
      - run: npm ci
      - run: npm test
